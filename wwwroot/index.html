// VERLAUF (History)
// ════════════════════════════════════════════════════════════════════════════
// Zustand der Verlaufsansicht. items sammelt alle bisher geladenen Einträge,
// offset/limit steuern das "Mehr laden", done=true wenn keine weiteren folgen.
const HIST = { items: [], offset: 0, limit: 200, done: false };

// YAMS-Note farbig (1 = beste … 5 = schwächste). Leere Note → nichts anzeigen.
function noteHtml(n) {
  return n > 0 ? `<span class="nt-${n}" title="YAMS-Note">Note ${n}</span>` : '';
}

// Tagesüberschrift relativ zu heute: "Heute" / "Gestern" / ausgeschriebenes Datum.
function dayLabel(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day   = new Date(d); day.setHours(0, 0, 0, 0);
  const diff  = Math.round((today - day) / 86400000);
  if (diff === 0) return 'Heute';
  if (diff === 1) return 'Gestern';
  return day.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

// Verlauf neu laden (erste Seite).
async function loadHistory() {
  HIST.items = []; HIST.offset = 0; HIST.done = false;
  $('history-wrap').innerHTML = '<div class="hist-toolbar">Lade Verlauf…</div>';
  await histFetch();
}

// Nächste Seite nachladen und an die bestehende Liste anhängen.
async function histFetch() {
  try {
    const batch = await api(`/api/history?limit=${HIST.limit}&offset=${HIST.offset}`);
    HIST.items.push(...batch);
    HIST.offset += batch.length;
    HIST.done = batch.length < HIST.limit;
    renderHistory();
  } catch (e) {
    $('history-wrap').innerHTML =
      `<div class="hist-toolbar">Verlauf konnte nicht geladen werden: ${esc(e.message)}</div>`;
  }
}

function histLoadMore() { if (!HIST.done) histFetch(); }

async function clearHistory() {
  if (!confirm('Gesamten Abspielverlauf löschen? Die Spielzähler der Songs bleiben erhalten.')) return;
  try {
    const r = await fetch('/api/history', { method: 'DELETE' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    showToast('Verlauf geleert', 2000);
    loadHistory();
  } catch (e) { showToast('Fehler: ' + e.message, 4000); }
}

function renderHistory() {
  if (!HIST.items.length) {
    $('history-wrap').innerHTML =
      '<div class="hist-toolbar">Noch nichts gespielt. Sobald du einen Song zu Ende hörst, erscheint er hier.</div>';
    return;
  }
  let html = `<div class="hist-toolbar"><span>${HIST.items.length} Einträge</span>
      <span class="spacer"></span>
      <button class="btn secondary" id="hist-clear">Verlauf leeren</button></div>`;
  let lastDay = '';
  HIST.items.forEach((it, idx) => {
    const d  = new Date(it.playedAt);
    const dl = dayLabel(d);
    if (dl !== lastDay) { html += `<div class="hist-day">${dl}</div>`; lastDay = dl; }
    const hhmm = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    const sub  = esc(it.artist)
               + (it.albumTitle ? ` — ${esc(it.albumTitle)}` : '')
               + (it.year ? ` (${it.year})` : '');
    html += `
      <div class="hist-row" data-idx="${idx}">
        <div class="hist-time">${hhmm}</div>
        <div class="hist-cover"><img src="/api/cover/${it.albumId}" loading="lazy"
             onerror="this.style.display='none'" alt=""></div>
        <div class="hist-main">
          <div class="hist-song">${esc(it.title)}</div>
          <div class="hist-sub">${sub}</div>
        </div>
        <div class="hist-meta">
          ${noteHtml(it.note)}
          <span>${fmt(it.secs)}</span>
          ${it.count > 0 ? `<span title="Insgesamt gespielt">${it.count}×</span>` : ''}
          <span class="hist-play" title="Abspielen">&#9654;</span>
        </div>
      </div>`;
  });
  if (!HIST.done) html += '<button class="btn secondary hist-more" id="hist-more">Mehr laden</button>';
  $('history-wrap').innerHTML = html;
}

// ════════════════════════════════════════════════════════════════════════════
// VOLLBILD-ANSICHT ("Screensaver")
// ════════════════════════════════════════════════════════════════════════════
// open = Ansicht sichtbar; clock = Interval-Handle für die Uhr.
const SS = { open: false, clock: null };

async function openScreensaver() {
  SS.open = true;
  $('screensaver').classList.add('open');
  ssSync();
  ssProgress();
  ssClockTick();
  SS.clock = setInterval(ssClockTick, 1000);
  // Echtes Browser-Vollbild anfordern (läuft im Klick-Gesture-Kontext).
  try { await document.documentElement.requestFullscreen(); } catch {}
}

function closeScreensaver() {
  SS.open = false;
  $('screensaver').classList.remove('open');
  if (SS.clock) { clearInterval(SS.clock); SS.clock = null; }
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

// Cover, Song, Artist, Note, Album und "Nächster Titel" aus der aktuellen Queue.
function ssSync() {
  if (!SS.open) return;
  const s = Q.songs[Q.pos];
  if (!s) {
    $('ss-song').textContent   = 'Kein Song';
    $('ss-artist').textContent = '';
    $('ss-note').innerHTML     = '';
    $('ss-album').textContent  = '';
    if ($('ss-bgpl')) $('ss-bgpl').style.display = 'none';
    $('ss-next').innerHTML     = '';
    $('ss-cover-img').removeAttribute('src');
    $('ss-bg').style.backgroundImage = 'none';
    return;
  }
  $('ss-song').textContent   = s.title  || '';
  $('ss-artist').textContent = s.artist || '';
  $('ss-note').innerHTML     = ssNoteMarkup(s.note || 0, RC.songId === s.songId ? RC.proposal : null);
  $('ss-album').textContent  = [s.albumTitle, s.year > 0 ? s.year : ''].filter(Boolean).join('   ');
  ssRenderBgpl();
  const cover = s.albumId ? `/api/cover/${s.albumId}` : '';
  if (cover) { $('ss-cover-img').src = cover; $('ss-bg').style.backgroundImage = `url('${cover}')`; }
  else       { $('ss-cover-img').removeAttribute('src'); $('ss-bg').style.backgroundImage = 'none'; }
  const nxt = Q.songs[Q.pos + 1];
  $('ss-next').innerHTML = nxt ? `Als Nächstes&nbsp; <b>${esc(nxt.title)}</b> — ${esc(nxt.artist)}` : '';
}

// Fortschrittsbalken + abgelaufene/verbleibende Zeit aus dem Audio-Element.
function ssProgress() {
  if (!SS.open) return;
  const dur = audioEl.duration, cur = audioEl.currentTime || 0;
  if (dur && !isNaN(dur)) {
    $('ss-bar-fill').style.width = (cur / dur * 100) + '%';
    $('ss-cur').textContent = fmt(Math.floor(cur));
    $('ss-rem').textContent = '-' + fmt(Math.max(0, Math.ceil(dur - cur)));
  } else {
    $('ss-bar-fill').style.width = '0%';
    $('ss-cur').textContent = fmt(Math.floor(cur));
    $('ss-rem').textContent = '';
  }
}

function ssClockTick() {
  $('ss-clock').textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

// ════════════════════════════════════════════════════════════════════════════
// FERNSTEUERUNG (iPhone-Remote + optional Gamepad) – Poll-Empfänger
// ════════════════════════════════════════════════════════════════════════════
// Der Player meldet seinen Zustand und holt ~alle 0,9 s Transport-Kommandos ab.
// Note-Vorschläge (Handy/Gamepad) schreibt der Server; der aktuelle Vorschlag
// kommt im Poll zurück und wird im Screensaver angezeigt.
const RC = { proposal: null, songId: null, bgpl: null, bgplSongId: null, timer: null };

function playerNext()      { if (Q.pos + 1 < Q.songs.length) { Q.pos++; playCurrent(); } }
function playerPrev()      { if (Q.pos > 0) { Q.pos--; playCurrent(); } }
function playerPlayPause() { if (audioEl.paused) audioEl.play().catch(() => {}); else audioEl.pause(); }
function playerPause()     { audioEl.pause(); }   // nur pausieren – Queue bleibt erhalten, ⏯ setzt fort
function playerStop()      { audioEl.pause(); audioEl.src = ''; queueClear(); bgActive = false; bgAudioEl.pause(); releaseWakeLock(); if (SS.open) ssSync(); }

function rcExec(cmd) {
  if      (cmd === 'next')      playerNext();
  else if (cmd === 'prev')      playerPrev();
  else if (cmd === 'playpause') playerPlayPause();
  else if (cmd === 'pause')     playerPause();
  else if (cmd === 'stop')      playerStop();
}

// Kommando an den Server (auch vom lokalen Gamepad genutzt – ein Pfad für alles).
async function rcSend(cmd) {
  try { await fetch('/api/remote/command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cmd }) }); }
  catch {}
}

async function rcTick() {
  const s = Q.songs[Q.pos];
  if (s) {
    try {
      await fetch('/api/remote/nowplaying', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          songId: s.songId, headId: s.albumId,
          title: s.title || '', artist: s.artist || '', album: s.albumTitle || '',
          note: s.note || 0,
          pos: Math.floor(audioEl.currentTime || 0),
          dur: Math.floor(audioEl.duration || 0),
        }),
      });
    } catch {}
  }
  try {
    const d = await (await fetch('/api/remote/poll')).json();
    (d.commands || []).forEach(rcExec);
    const curId = s ? s.songId : null;
    const prop  = d.proposal ?? null;
    if (prop !== RC.proposal || curId !== RC.songId) {
      RC.proposal = prop; RC.songId = curId;
      if (SS.open) ssRenderNote();
    }
    // BGPL-Mitgliedschaft des laufenden Songs: bei Songwechsel nur merken,
    // bei echter Änderung (Fernbedienung/Gamepad) Toast + Abzeichen aktualisieren.
    const bg = !!d.bgpl;
    if (curId !== RC.bgplSongId) {
      RC.bgplSongId = curId; RC.bgpl = bg;
      if (SS.open) ssRenderBgpl();
    } else if (bg !== RC.bgpl) {
      RC.bgpl = bg;
      showToast(bg ? '+ Background PL' : '− Background PL', 1800);
      if (SS.open) ssRenderBgpl();
    }
  } catch {}
}

function rcStart() {
  if (!RC.timer) RC.timer = setInterval(rcTick, 900);
  gamepadStart();
}

// Optionaler Bluetooth-Gamecontroller über die Gamepad-API. D-Pad hoch = besser
// (Note −1), runter = schlechter; links/rechts = zurück/vor; A = Play/Pause, B = Stop;
// X = zur Background-Playlist (+), Y = aus Background-Playlist (−).
// Läuft über denselben Server-Pfad wie die Handy-Fernbedienung.
const GP = { active: false, prev: {} };
function gamepadStart() {
  if (GP.active || !('getGamepads' in navigator)) return;
  GP.active = true;
  requestAnimationFrame(gamepadPoll);
}
function gpEdge(name, pressed) { const was = GP.prev[name] || false; GP.prev[name] = pressed; return pressed && !was; }
function gamepadPoll() {
  const gp = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(p => p);
  if (gp) {
    const b = gp.buttons.map(x => x.pressed), ax = gp.axes || [];
    if (gpEdge('up',    b[12] || ax[1] < -0.6)) rcSend('note:up');
    if (gpEdge('down',  b[13] || ax[1] >  0.6)) rcSend('note:down');
    if (gpEdge('left',  b[14] || ax[0] < -0.6)) rcSend('prev');
    if (gpEdge('right', b[15] || ax[0] >  0.6)) rcSend('next');
    if (gpEdge('a', b[0])) rcSend('playpause');
    if (gpEdge('b', b[1])) rcSend('stop');
    if (gpEdge('x', b[2])) rcSend('bgpl:add');
    if (gpEdge('y', b[3])) rcSend('bgpl:remove');
  }
  requestAnimationFrame(gamepadPoll);
}

// Note-Darstellung im Screensaver: gespeicherte Note, bei offenem Vorschlag
// zusätzlich "→ Vorschlag" und ein "vorgemerkt"-Badge.
function ssNoteMarkup(stored, proposal) {
  if (proposal == null || proposal === stored) return noteHtml(stored || 0);
  const from = stored > 0 ? `<span class="nt-${stored} ss-note-old">Note ${stored}</span>` : '<span class="ss-note-old">—</span>';
  return `${from}<span class="ss-note-arrow">→</span><span class="nt-${proposal} ss-note-new">Note ${proposal}</span><span class="ss-note-pill">&#10003; vorgemerkt</span>`;
}
function ssRenderNote() {
  const s = Q.songs[Q.pos];
  $('ss-note').innerHTML = s ? ssNoteMarkup(s.note || 0, RC.songId === s.songId ? RC.proposal : null) : '';
}
// BGPL-Abzeichen im Screensaver: sichtbar, wenn der laufende Song in der Background-Playlist ist.
function ssRenderBgpl() {
  const el = $('ss-bgpl');
  if (!el) return;
  const s = Q.songs[Q.pos];
  const member = !!(s && RC.bgplSongId === s.songId && RC.bgpl);
  el.style.display = member ? 'inline-block' : 'none';
}
</script>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAMS Web Player</title>
<style>
/*
 * ════════════════════════════════════════════════════════════════════════
 * CSS CUSTOM PROPERTIES (Design-Tokens)
 * ════════════════════════════════════════════════════════════════════════
 * :root definiert globale CSS-Variablen die überall im Stylesheet per
 * var(--name) genutzt werden können.
 * Vorteil: Farbe/Größe nur an einer Stelle ändern → wirkt sich überall aus.
 * ════════════════════════════════════════════════════════════════════════
 */
:root {
  /* ── Hintergrund-Farben (Dunkel-Theme, abgestuft) ── */
  --bg:        #0d0d1a;   /* Seiten-Hintergrund (dunkelster Ton) */
  --bg2:       #13132a;   /* Header, Panels, Player-Bar */
  --card:      #1a1a35;   /* Album-Karten, aufgeklappte Tracks */
  --card-h:    #22224a;   /* Hover-Zustand von Karten */
  --border:    #2a2a50;   /* Trennlinien und Rahmen */

  /* ── Akzentfarben ── */
  --accent:    #7c3aed;   /* Violett: aktive Buttons, Links, Fokus-Ring */
  --accent-h:  #9d5cf6;   /* Heller Violett: Hover auf Akzent-Elementen */
  --play:      #22c55e;   /* Grün: Play-Button, spielender Track, Fortschritt */
  --play-h:    #4ade80;   /* Heller Grün: Hover auf Play-Elementen */

  /* ── Text-Farben ── */
  --text:      #e2e8f0;   /* Normaler Text (hell auf dunklem Hintergrund) */
  --muted:     #8892a4;   /* Gedimmter Text: Labels, Sekundärinfos, Icons */

  /* ── Status/Bewertungs-Farben ── */
  --gold:      #f59e0b;   /* Gold: Wertungs-Sterne, aktive Jahres-Tabs */
  --green:     #10b981;   /* Grün: "All Time Best"-Button aktiv */
  --orange:    #f97316;   /* Orange: Warnung/Mittelwert */
  --danger:    #ef4444;   /* Rot: Fehler, ausgeschlossene Genres */

  /* ── Layout-Maße ── */
  --radius:    8px;       /* Standard-Abrundung für Buttons/Cards */
  --player-h:  72px;      /* Höhe der Player-Leiste am unteren Rand */
  --cover-w:   76px;      /* Breite/Höhe der Album-Cover in der Liste */
  --num-w:     34px;      /* Breite der laufenden Nummer links */
  --gap:       12px;      /* Abstand zwischen Cover und Info */

  /*
   * --track-indent: Einrückung der Song-Liste unter einem Album.
   * Berechnet so, dass die Songs exakt unter dem Titel-Text beginnen:
   * 16px (Padding) + Nummernbreite + Gap + Cover-Breite + Gap
   */
  --track-indent: calc(16px + var(--num-w) + var(--gap) + var(--cover-w) + var(--gap));
}
/* ── Reset & Basis-Styles ─────────────────────────────────────────────────
   box-sizing:border-box = Padding/Border werden IN die angegebene Breite
   eingerechnet (nicht dazu addiert). Viel intuitiver als der Browser-Standard.
   margin:0; padding:0 entfernt Browser-Abstände die sonst unerwarteten
   Whitespace erzeugen würden. */
*{box-sizing:border-box;margin:0;padding:0}

/* height:100% auf html UND body nötig damit #app die volle Höhe nutzen kann.
   system-ui,-apple-system = Nutzt den nativen Systemfont (San Francisco auf
   Mac/iOS, Segoe UI auf Windows) → kein extra Font-Download nötig. */
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:14px}

/* Buttons standardmäßig ohne Browser-Styling (kein Rand, kein Hintergrund).
   cursor:pointer damit immer eine Hand erscheint. */
button{cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}

/* Einheitliches Styling für alle Eingabefelder und Dropdowns. */
input,select{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:13px;width:100%}

/* Fokus-Ring: 2px violetter Rand statt Browser-Standard (blauer Rand/Glühen).
   border-color:transparent verhindert doppelten Rand. */
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}

/* Dropdown-Optionen erben NICHT automatisch das Hintergrund-Styling →
   muss explizit gesetzt werden damit es nicht weiß erscheint. */
select option{background:var(--bg2)}

/* ── Haupt-Layout ────────────────────────────────────────────────────────
   #app ist der äußere Container der gesamten Anwendung.
   display:flex + flex-direction:column = alle Kinder stapeln sich vertikal.
   height:100vh = genau die Viewport-Höhe (Browser-Fenster, ohne Scrollbalken).
   So entsteht das "App-Layout": Header oben, scrollbarer Inhalt in der Mitte,
   Player-Bar unten – ohne dass die Seite als Ganzes scrollt. */
#app{display:flex;flex-direction:column;height:100vh}

header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0;
}
header h1{font-size:18px;font-weight:700;color:var(--accent-h);white-space:nowrap}
header h1 .web{color:var(--play)}
#stats-bar{font-size:12px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}

/* ── Suchleiste ─────────────────────────────────────── */
#search-panel{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;flex-shrink:0;
}
.sf{display:flex;flex-direction:column;gap:3px;min-width:120px}
.sf label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sf.wide{min-width:190px;flex:1}
#search-panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;width:100%}
#rating-val{color:var(--gold);font-weight:600;min-width:28px;display:inline-block;text-align:right}
input[type=range]{padding:3px 0;accent-color:var(--accent)}
.check-group{display:flex;flex-wrap:wrap;gap:4px 10px;padding:5px 0}
.cb-item{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text);cursor:pointer;white-space:nowrap}
.cb-item input[type=checkbox]{width:auto;padding:0;accent-color:var(--accent);cursor:pointer}
.btn{
  background:var(--accent);color:#fff;border-radius:6px;
  padding:6px 14px;font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s;flex-shrink:0;
}
.btn:hover{background:var(--accent-h)}
.btn.secondary{background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.btn.secondary:hover{background:var(--card);color:var(--text)}

/* ── By-Year Options Bar ─────────────────────────────── */
#byyear-panel{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:10px 20px;display:none;flex-wrap:wrap;gap:8px;align-items:flex-end;flex-shrink:0;
}
#byyear-panel.visible{display:flex}
.sf-check{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);
  cursor:pointer;padding-bottom:6px;white-space:nowrap;
}
.sf-check input[type=checkbox]{width:auto;padding:0;accent-color:var(--accent)}
.report-only{display:none!important}
#byyear-panel.report-mode .report-only{display:flex!important}
.best-only{display:none!important}
#byyear-panel.best-mode .best-only{display:flex!important}
#rating-val-by{color:var(--gold);font-weight:600;min-width:30px;display:inline-block;text-align:right}

/* ── Jahr-Reiter ────────────────────────────────────────── */
#year-nav{
  background:var(--bg2);border-bottom:1px solid var(--border);
  display:none;align-items:center;flex-shrink:0;padding:0 4px;
}
#year-nav.visible{display:flex}
.yn-scroll{
  flex-shrink:0;padding:6px 8px;color:var(--muted);font-size:14px;
  background:none;border:none;cursor:pointer;transition:color .15s;line-height:1;
}
.yn-scroll:hover{color:var(--text)}
#year-tabs{
  display:flex;gap:4px;overflow-x:auto;flex:1;padding:5px 0;
  scrollbar-width:none;
}
#year-tabs::-webkit-scrollbar{display:none}
.yn-tab{
  flex-shrink:0;padding:4px 11px;border-radius:4px;font-size:12px;font-weight:600;
  border:1px solid var(--border);color:var(--muted);background:var(--bg);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.yn-tab:hover{color:var(--text);background:var(--card)}
.yn-tab.active{color:#000;background:var(--gold);border-color:var(--gold)}

/* ── Toolbar ────────────────────────────────────────── */
#toolbar{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:6px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;
}
.mode-btns{display:flex;gap:3px;flex-shrink:0}
.mode-btn{
  font-size:12px;padding:5px 12px;border-radius:4px;
  border:1px solid var(--border);color:var(--muted);background:var(--bg);
  transition:all .15s;font-weight:600;white-space:nowrap;
}
.mode-btn:hover{color:var(--text);background:var(--card)}
.mode-btn[data-mode="all"].active   {color:#fff ;background:var(--accent);border-color:var(--accent)}
.mode-btn[data-mode="best"].active  {color:#000 ;background:var(--gold)  ;border-color:var(--gold)}
.mode-btn[data-mode="report"].active{color:#000 ;background:var(--green) ;border-color:var(--green)}
.mode-btn[data-mode="playlists"].active{color:#fff;background:#e44;border-color:#e44}

/* ── Playlist-Zeilen ────────────────────────────────── */
.pl-row{
  display:grid;
  grid-template-columns:var(--num-w) var(--cover-w) 1fr auto auto;
  align-items:center;column-gap:var(--gap);
  padding:10px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .12s;
}
.pl-row:hover{background:var(--card)}
.pl-row.expanded{background:var(--card);border-bottom:none}
.pl-row.pl-active{border-left:3px solid var(--play);padding-left:13px}
.pl-icon{
  width:var(--cover-w);height:var(--cover-w);border-radius:5px;
  background:linear-gradient(135deg,#1e1e40,#2a1a50);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;color:#4a4a80;flex-shrink:0;
}
.pl-info{min-width:0}
.pl-name{font-size:14px;font-weight:700;font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.pl-meta{font-size:11px;color:var(--muted)}
.pl-actions{display:flex;gap:4px;flex-shrink:0}
.pl-qplay{
  font-size:13px;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);border:1px solid var(--border);color:var(--muted);
  transition:all .15s;cursor:pointer;
}
.pl-qplay:hover{background:var(--play);color:#fff;border-color:var(--play)}
.pl-shuffle{font-size:11px;font-weight:700;font-style:italic}
.pl-chevron{color:var(--muted);font-size:16px;padding:4px 2px;user-select:none;transition:transform .2s}
.pl-row.expanded .pl-chevron{transform:rotate(90deg)}

/* ── Playlist-Track-Liste ───────────────────────────── */
.pl-tracks{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:0 16px 12px var(--track-indent);display:none;
}
.pl-tracks.open{display:block}
.pl-tracks-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 4px 8px 0;border-bottom:1px solid var(--border);margin-bottom:6px;
}
.btn-play-pl{
  font-size:11px;font-weight:700;background:var(--play);color:#fff;
  border-radius:12px;padding:3px 10px;transition:background .15s;cursor:pointer;
}
.btn-play-pl:hover{background:var(--play-h)}
.pl-track-row{
  display:flex;gap:8px;padding:4px 6px;border-radius:4px;
  align-items:center;cursor:pointer;transition:background .1s;
}
.pl-track-row:hover{background:var(--card-h)}
.pl-track-row.pl-playing .tr-title{color:var(--play)}
.pl-track-row.pl-playing .tr-num{color:var(--play)}
.pl-track-row.pl-playing .tr-play{color:var(--play)}
#result-count{font-size:12px;color:var(--muted)}
.sort-btns{display:flex;gap:3px}
.sort-btn{font-size:12px;padding:3px 9px;border-radius:4px;color:var(--muted);border:1px solid transparent;transition:all .15s}
.sort-btn:hover{color:var(--text);background:var(--card)}
.sort-btn.active{color:var(--accent-h);border-color:var(--accent);background:var(--card)}
.sort-btn.active::after{content:' ▲';font-size:10px}
.sort-btn.active[data-dir="desc"]::after{content:' ▼'}
#page-size-sel{width:76px;flex-shrink:0}
#sort-section{display:flex;align-items:center;gap:6px}

/* ── Jahr-Kopfzeile ─────────────────────────────────── */
.year-header{
  padding:8px 16px 5px;
  font-size:12px;font-weight:700;letter-spacing:1.5px;
  color:var(--accent-h);background:var(--bg);
  border-bottom:1px solid var(--border);
  border-top:2px solid var(--border);
  margin-top:4px;
}
.year-header:first-child{margin-top:0;border-top:none}

/* ── Album-Liste ─────────────────────────────────────────────────────────
   #list-wrap: flex:1 = nimmt den gesamten verbleibenden Platz ein (zwischen
   Toolbar und Player-Bar). overflow-y:auto = nur dieser Bereich scrollt,
   nicht die ganze Seite. padding-bottom verhindert dass der letzte Eintrag
   hinter der fixierten Player-Bar verschwindet. */
#list-wrap{flex:1;overflow-y:auto;padding-bottom:calc(var(--player-h) + 8px)}
#album-list{display:flex;flex-direction:column}

/* .album-row: CSS Grid mit 4 Spalten:
   1. Laufende Nummer (feste Breite --num-w)
   2. Cover-Bild (feste Breite --cover-w)
   3. Info-Bereich (flex:1 = nimmt restlichen Platz)
   4. Chevron-Pfeil (auto = nur so breit wie nötig)
   align-items:start = alle Spalten oben ausrichten (nicht vertikal zentrieren).
   transition:background = sanfter Hover-Effekt. */
.album-row{
  display:grid;
  grid-template-columns:var(--num-w) var(--cover-w) 1fr auto;
  align-items:start;
  column-gap:var(--gap);
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background .12s;
}
.album-row:hover{background:var(--card)}
.album-row.expanded{background:var(--card);border-bottom:none}
.album-row.web-active{border-left:3px solid var(--play);padding-left:13px}

.row-num{
  font-size:11px;color:var(--muted);text-align:right;
  padding-top:4px;font-variant-numeric:tabular-nums;
}

.row-cover{width:var(--cover-w);height:var(--cover-w);flex-shrink:0;position:relative}
.row-cover img{width:100%;height:100%;object-fit:cover;border-radius:5px;display:block}
.row-cover .no-cover{
  width:100%;height:100%;border-radius:5px;
  background:linear-gradient(135deg,#1e1e40,#2a1a50);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;color:#4a4a80;
}

.row-info{min-width:0;padding-top:2px}
.info-artist{font-size:11px;color:var(--accent-h);font-weight:600;margin-bottom:1px}
.info-title{
  font-size:14px;font-weight:700;font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.3;margin-bottom:4px;
}
.info-meta{font-size:11px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:3px}
.info-stats{font-size:11px;color:var(--muted)}
.info-stats span{margin-right:10px}

.ps-dot{
  display:inline-block;width:20px;height:20px;
  border-radius:3px;flex-shrink:0;vertical-align:middle;
  border:1px solid rgba(0,0,0,.3);
}
.ps-code{
  font-family:monospace;font-size:10px;color:#888;
  letter-spacing:.5px;vertical-align:middle;white-space:nowrap;
}

.note{font-weight:700;font-size:10px;letter-spacing:.3px;text-transform:uppercase}
.note-uber    {color:limegreen}
.note-sehrgut {color:palegreen}
.note-gut     {color:yellow}
.note-gehtso  {color:gold}
.note-maessig {color:orange}
.note-schlecht{color:darkred}
.amg          {font-size:10px;color:var(--muted)}
.genre-txt    {font-size:11px;color:var(--muted)}

/* ── Genre-Button & Popup ───────────────────────────── */
.genre-open-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--bg);border:1px solid var(--border);
  color:var(--muted);font-size:12px;padding:5px 11px;
  border-radius:5px;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.genre-open-btn:hover{color:var(--text);border-color:var(--muted)}
.genre-open-btn.has-sel{border-color:var(--accent);color:var(--accent-h)}
.genre-badge{
  background:var(--accent);color:#fff;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:10px;display:none;
}
.genre-badge.on{display:inline}
#genre-overlay{display:none;position:fixed;inset:0;z-index:300}
#genre-overlay.open{display:block}
#genre-popup{
  display:none;position:fixed;z-index:301;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.5);
  padding:14px 16px;max-width:720px;width:calc(100vw - 32px);
  max-height:65vh;overflow-y:auto;
}
#genre-popup.open{display:block}
.genre-popup-head{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
}
.genre-popup-head span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.genre-popup-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.genre-popup-close:hover{color:var(--text)}
.genre-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.genre-row+.genre-row{margin-top:6px}
.genre-row-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.5px;white-space:nowrap;margin-right:2px}
.g-chip{
  font-size:11px;padding:3px 9px;border-radius:12px;cursor:pointer;
  border:1px solid var(--border);color:var(--muted);background:var(--bg);
  transition:all .12s;white-space:nowrap;user-select:none;
}
.g-chip:hover{color:var(--text);border-color:var(--muted)}
.g-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.g-chip.partial{border-color:var(--accent);color:var(--accent-h)}
.g-chip.grp{font-weight:700;font-size:10px;letter-spacing:.4px;text-transform:uppercase}
.g-chip.excluded{background:var(--danger);border-color:var(--danger);color:#fff;text-decoration:line-through}
.genre-badge.excl{background:var(--danger)}

.row-chevron{
  color:var(--muted);font-size:16px;padding:4px 2px;
  align-self:center;transition:transform .2s;user-select:none;
}
.album-row.expanded .row-chevron{transform:rotate(90deg)}

/* ── Track-Bereich ───────────────────────────────────────────────────────
   Dieser Bereich erscheint direkt unter einem Album wenn es aufgeklappt wird.
   display:none = standardmäßig unsichtbar.
   .album-tracks.open → display:block = wird sichtbar wenn die Klasse "open"
   per JavaScript hinzugefügt wird.
   padding-left: var(--track-indent) richtet Songs exakt unter dem Albumtitel aus. */
.album-tracks{
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:0 16px 12px var(--track-indent);
  display:none;
}
.album-tracks.open{display:block}

.tracks-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 4px 8px 0;border-bottom:1px solid var(--border);margin-bottom:6px;
}
.tracks-header .tc{font-size:11px;color:var(--muted)}
.btn-play-album{
  font-size:11px;font-weight:700;
  background:var(--play);color:#fff;border-radius:12px;
  padding:3px 10px;transition:background .15s;
}
.btn-play-album:hover{background:var(--play-h);color:#000}

.track-row{
  display:flex;gap:8px;padding:3px 6px;border-radius:4px;
  align-items:center;transition:background .1s;
  cursor:pointer;
}
.track-row:hover{background:var(--card-h)}
.track-row:hover .tr-play{color:var(--play)}
.track-row.note-1{color:limegreen;font-weight:700}
.track-row.note-2{color:palegreen;font-weight:700}
.track-row.note-other{color:var(--muted);font-size:12px}
.track-row.playing .tr-title{color:var(--play)}
.track-row.playing .tr-num{color:var(--play)}

.tr-num{width:22px;text-align:right;flex-shrink:0;font-size:11px;color:var(--muted)}
.tr-play{width:18px;text-align:center;flex-shrink:0;font-size:13px;color:var(--muted)}
.tr-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.tr-dur{width:34px;text-align:right;flex-shrink:0;font-size:11px;color:var(--muted)}
.tr-count{width:28px;text-align:right;flex-shrink:0;font-size:11px;color:var(--muted)}

.t-spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--play);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Pagination ─────────────────────────────────────── */
#pagination{
  padding:16px 20px 10px;display:flex;justify-content:center;align-items:center;
  gap:5px;flex-wrap:wrap;border-top:1px solid var(--border);margin-top:8px;
}
.pg-btn{min-width:34px;height:30px;border-radius:5px;font-size:12px;background:var(--card);border:1px solid var(--border);color:var(--muted);transition:all .15s;padding:0 7px}
.pg-btn:hover{background:var(--card-h);color:var(--text)}
.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pg-btn:disabled{opacity:.3;cursor:default}
#pg-info{font-size:11px;color:var(--muted);padding:0 6px}

/* ── Lade / Leer ────────────────────────────────────── */
#loading{text-align:center;padding:60px;color:var(--muted);display:none}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
#empty{text-align:center;padding:80px 20px;color:var(--muted);display:none}
#empty .icon{font-size:56px;margin-bottom:14px}

/* ── Web Player Bar ──────────────────────────────────────────────────────
   position:fixed = klebt am unteren Bildschirmrand, auch beim Scrollen.
   bottom:0;left:0;right:0 = volle Breite, unten angeheftet.
   z-index:200 = erscheint über der Album-Liste (die kein z-index hat).
   Der #list-wrap hat padding-bottom damit der letzte Eintrag nicht
   hinter dieser Bar verschwindet. */
#player{
  position:fixed;bottom:0;left:0;right:0;height:var(--player-h);
  background:var(--bg2);border-top:2px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 16px;z-index:200;
}
#player-cover{
  width:44px;height:44px;border-radius:5px;
  background:var(--card);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#4a4a80;font-size:18px;overflow:hidden;cursor:pointer;
}
#player-cover img{width:100%;height:100%;object-fit:cover}
#player-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
#player-title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player-artist{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player-progress{display:flex;align-items:center;gap:6px;margin-top:2px}
#progress-bar{
  flex:1;height:3px;padding:0;
  -webkit-appearance:none;appearance:none;
  background:var(--border);border-radius:2px;outline:none;cursor:pointer;
}
#progress-bar::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:10px;height:10px;border-radius:50%;
  background:var(--play);cursor:pointer;
}
#progress-bar::-moz-range-thumb{
  width:10px;height:10px;border-radius:50%;border:none;
  background:var(--play);cursor:pointer;
}
#progress-time{font-size:10px;color:var(--muted);white-space:nowrap;flex-shrink:0}

#play-pause-btn{
  flex-shrink:0;background:var(--play);color:#000;font-size:16px;
  width:36px;height:36px;border-radius:8px;border:none;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
#play-pause-btn:hover{background:var(--play-h)}
.q-nav, #player-stop{
  flex-shrink:0;
  background:var(--card);border:1px solid var(--border);
  color:var(--muted);font-size:15px;
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.q-nav:hover, #player-stop:hover{
  background:var(--card-h);color:var(--text);border-color:var(--muted);
}
#player-badge{flex-shrink:0;background:var(--play);color:#000;font-size:11px;font-weight:700;padding:4px 10px;border-radius:16px}
#vol-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
#vol-wrap span{font-size:16px;line-height:1;user-select:none}
#vol-slider{
  -webkit-appearance:none;appearance:none;
  width:72px;height:4px;border-radius:2px;
  background:var(--border);outline:none;cursor:pointer;padding:0;
}
#vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:14px;height:14px;border-radius:50%;
  background:var(--play);cursor:pointer;
}
#vol-slider::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;border:none;
  background:var(--play);cursor:pointer;
}

/* ── EQ-Modal ────────────────────────────────────────────────────────────
   Zwei-Layer-Ansatz: Overlay (dunkle Fläche) + Modal (das eigentliche Fenster).
   #eq-overlay: position:fixed;inset:0 = bedeckt den gesamten Viewport.
   rgba(0,0,0,.6) = halbtransparentes Schwarz → Hintergrund wird abgedunkelt.
   z-index:800 = über fast allem anderen (ausser dem Modal selbst z-index:801).
   Klick auf das Overlay schließt das Modal (→ eqClose() in JavaScript).

   #eq-modal: Schwebt über der Player-Bar (bottom = player-Höhe + Abstand).
   right:16px = an der rechten Seite positioniert. */
#eq-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:800;
  display:none;
}
#eq-overlay.open{display:block}
#eq-modal{
  position:fixed;bottom:calc(var(--player-h) + 14px);right:16px;
  width:520px;max-width:96vw;
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:18px 22px 20px;z-index:801;box-shadow:0 8px 40px rgba(0,0,0,.7);
  display:none;
}
#eq-modal.open{display:block}
#eq-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
#eq-head h3{flex:1;font-size:15px;font-weight:700;color:var(--accent-h);letter-spacing:.5px}
#eq-preset{flex-shrink:0;width:160px}
#eq-reset-btn{
  flex-shrink:0;background:var(--card);border:1px solid var(--border);
  color:var(--muted);font-size:12px;padding:5px 12px;border-radius:6px;
  transition:all .15s;
}
#eq-reset-btn:hover{background:var(--card-h);color:var(--text)}
#eq-close-btn{
  flex-shrink:0;background:none;border:none;color:var(--muted);
  font-size:18px;line-height:1;padding:2px 6px;border-radius:4px;
  transition:color .15s;
}
#eq-close-btn:hover{color:var(--text)}
#eq-bands{display:flex;gap:0;justify-content:space-between;align-items:flex-end}
.eq-band{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.eq-db{font-size:11px;color:var(--play);font-weight:600;min-width:30px;text-align:center;height:16px}
.eq-slider{
  writing-mode:vertical-lr;direction:rtl;
  -webkit-appearance:slider-vertical;appearance:slider-vertical;
  width:28px;height:120px;
  accent-color:var(--accent);cursor:pointer;
  background:transparent;
}
.eq-label{font-size:10px;color:var(--muted);margin-top:2px}
#eq-btn{
  flex-shrink:0;background:var(--card);border:1px solid var(--border);
  color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.5px;
  width:36px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
#eq-btn:hover,#eq-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── Toast-Benachrichtigung ───────────────────────────────────────────────
   Kurze Einblendung (z.B. "♫ Songname", "Gestoppt") die nach 2-3 Sekunden
   wieder verschwindet.
   left:50% + transform:translateX(-50%) = horizontal zentriert, unabhängig
   von der eigenen Breite. Das ist der Standard-Trick für horizontale Zentrierung
   von absolut/fixed positionierten Elementen.
   opacity:0 + transition:opacity = sanftes Ein/Ausblenden via CSS.
   pointer-events:none = Toast blockiert keine Klicks darunter.
   white-space:nowrap = kein Zeilenumbruch, Toast bleibt einzeilig.
   #toast.playing = grüner Rand wenn ein Song startet (visuelles Feedback). */
#toast{
  position:fixed;bottom:calc(var(--player-h)+10px);left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--border);border-radius:7px;
  padding:8px 18px;font-size:13px;z-index:500;
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
}
#toast.show{opacity:1}
#toast.playing{border-color:var(--play);background:#0a1a0f}

/* ── Responsive Design (Mobilgeräte) ─────────────────────────────────────
   @media(max-width:600px) = gilt NUR wenn der Viewport schmaler als 600px ist.
   CSS Custom Properties können hier überschrieben werden → alle Elemente
   die var(--cover-w) etc. nutzen passen sich automatisch an.
   Änderungen für Mobilgeräte:
   - Kleinere Cover und Nummern (mehr Platz für den Titel)
   - Höhere Player-Bar (mehr Platz für Finger-Touch)
   - Kein Lautstärke-Slider (Handy hat eigene Lautstärketasten)
   - Kein "Web"-Badge (kein Platz)
   - Kleinere Mode-Buttons */
@media(max-width:600px){
  :root{--cover-w:54px;--num-w:24px;--gap:8px;--player-h:80px}
  .info-title{font-size:13px}
  #player-badge{display:none}
  .info-meta{gap:6px}
  .mode-btn{padding:4px 8px;font-size:11px}
  #vol-wrap{display:none}
}

/* ── Spielstatus-Legende Modal ───────────────────────────────────────────── */
#ps-legend-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:900;align-items:center;justify-content:center}
#ps-legend-overlay.open{display:flex}
#ps-legend-box{background:#1e1e2e;border:1px solid #444;border-radius:10px;padding:24px;max-width:820px;width:95%;max-height:90vh;overflow-y:auto;color:#ddd;font-size:13px}
#ps-legend-box h2{margin:0 0 16px;font-size:16px;color:#ccc}
#ps-legend-close{float:right;background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;line-height:1}
#ps-legend-box table{border-collapse:collapse;width:100%}
#ps-legend-box th{background:#2a2a3e;padding:7px 10px;text-align:center;font-weight:600;color:#bbb;border-bottom:2px solid #444}
#ps-legend-box td{padding:6px 10px;text-align:center;border-bottom:1px solid #333}
#ps-legend-box tr:last-child td{border-bottom:none}
#ps-legend-box tr:hover td{background:#252535}
.ps-swatch{display:inline-block;width:42px;height:28px;border-radius:5px;vertical-align:middle;border:1px solid rgba(255,255,255,.2)}
.ps-status{font-size:15px}
.ps-desc{text-align:left!important;color:#bbb}
.ps-score{font-family:monospace;color:#999}
/* ════════════════════════════════════════════════════════════════════════
 * VERLAUF + VOLLBILD-ANSICHT ("SCREENSAVER") – Erweiterungen
 * ════════════════════════════════════════════════════════════════════════ */

/* Display-Schrift NUR für die Vollbildansicht. Lokal gehostet (offlinefähig);
   fällt automatisch auf eine schmale System-Schrift zurück, falls die Dateien
   fehlen. */
@font-face{font-family:'Barlow Condensed';font-weight:600;font-style:normal;
  font-display:swap;src:url('/fonts/BarlowCondensed-600.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-style:normal;
  font-display:swap;src:url('/fonts/BarlowCondensed-700.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:800;font-style:normal;
  font-display:swap;src:url('/fonts/BarlowCondensed-800.woff2') format('woff2')}

/* YAMS-Note farbig (1 = beste … 5 = schwächste) – für Verlauf und Vollbild */
.nt-1{color:#22c55e}.nt-2{color:#84cc16}.nt-3{color:var(--gold)}
.nt-4{color:var(--orange)}.nt-5{color:var(--danger)}

/* ── Modus-Button "Verlauf" ── */
.mode-btn[data-mode="history"].active{color:#fff;background:#0ea5a3;border-color:#0ea5a3}

/* ── Verlauf-Ansicht ── */
#history-wrap{display:none;flex-direction:column;gap:1px;padding:4px 0}
#history-wrap.visible{display:flex}
.hist-toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--muted);font-size:12px}
.hist-toolbar .spacer{flex:1}
.hist-day{position:sticky;top:0;z-index:1;background:var(--bg);
  padding:12px 16px 5px;font-size:12px;font-weight:700;color:var(--accent-h);letter-spacing:.02em}
.hist-row{display:grid;grid-template-columns:48px 40px 1fr auto;align-items:center;
  gap:12px;padding:6px 16px;border-radius:8px;cursor:pointer}
.hist-row:hover{background:var(--card-h)}
.hist-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.hist-cover{width:40px;height:40px;border-radius:5px;overflow:hidden;background:var(--bg2)}
.hist-cover img{width:100%;height:100%;object-fit:cover;display:block}
.hist-main{min-width:0}
.hist-song{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-meta{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.hist-note{font-weight:700}
.hist-play{color:var(--play);font-size:14px}
.hist-more{margin:14px auto;padding:8px 20px}

/* ── Vollbild-Ansicht ("Screensaver") ── */
#screensaver{position:fixed;inset:0;z-index:9999;display:none;color:#fff;overflow:hidden;
  background:#000;font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif}
#screensaver.open{display:block}
/* Unscharfes Cover als Ambient-Hintergrund – der Screen glüht in der Albumfarbe */
#ss-bg{position:absolute;inset:-8%;background-size:cover;background-position:center;
  filter:blur(60px) saturate(1.3) brightness(.55);transform:scale(1.1);transition:background-image .6s ease}
#ss-scrim{position:absolute;inset:0;
  background:radial-gradient(130% 100% at 20% 30%,transparent 0,rgba(0,0,0,.55) 100%),
             linear-gradient(to top,rgba(0,0,0,.85),transparent 55%)}
#ss-content{position:relative;height:100%;display:flex;flex-direction:column;padding:clamp(20px,4vw,64px)}
#ss-clock{position:absolute;top:clamp(16px,3vw,48px);right:clamp(20px,4vw,64px);
  font-weight:600;font-size:clamp(2rem,5vw,5rem);line-height:1;color:rgba(255,255,255,.92);font-variant-numeric:tabular-nums}
#ss-hero{flex:1;display:flex;align-items:center;gap:clamp(20px,4vw,64px);min-height:0}
#ss-cover{flex-shrink:0;width:min(38vh,38vw);aspect-ratio:1;border-radius:12px;overflow:hidden;
  background:rgba(255,255,255,.06);box-shadow:0 20px 70px rgba(0,0,0,.6)}
#ss-cover img{width:100%;height:100%;object-fit:cover;display:block}
#ss-text{min-width:0;flex:1}
#ss-song{font-weight:800;font-size:clamp(2.5rem,7vw,9rem);line-height:.95;letter-spacing:-.01em;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#ss-artist{font-weight:600;font-size:clamp(1.5rem,4vw,4.5rem);line-height:1.05;color:rgba(255,255,255,.82);
  margin-top:.12em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#ss-albumline{display:flex;align-items:center;gap:.7em;margin-top:.5em;
  font-size:clamp(1rem,2vw,2rem);color:rgba(255,255,255,.65)}
#ss-note{font-weight:700;letter-spacing:.06em}
#ss-bgpl{display:none;font-size:.55em;font-weight:800;letter-spacing:.1em;color:#a7e03a;background:#16321c;border:1px solid #2f6b35;border-radius:999px;padding:.12em .6em;vertical-align:middle}
#ss-foot{flex-shrink:0}
#ss-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
#ss-bar-fill{height:100%;width:0;background:var(--play);border-radius:999px}
#ss-times{display:flex;justify-content:space-between;margin-top:.5em;
  font-size:clamp(1rem,2vw,1.8rem);color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
#ss-next{margin-top:.8em;font-size:clamp(.9rem,1.6vw,1.4rem);color:rgba(255,255,255,.55);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ss-next b{color:rgba(255,255,255,.82);font-weight:600}
#ss-close{position:absolute;bottom:clamp(16px,3vw,40px);right:clamp(20px,4vw,64px);
  width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:20px;
  opacity:.45;transition:opacity .2s}
#ss-close:hover{opacity:1}
#ss-open-btn{font-size:16px;line-height:1}
/* Hochkant / schmal: Block stapeln, zentriert */
@media (max-aspect-ratio:1/1){
  #ss-hero{flex-direction:column;justify-content:center;text-align:center}
  #ss-artist{white-space:normal}
  #ss-cover{width:min(42vh,62vw)}
  #ss-albumline{justify-content:center}
}
@media (prefers-reduced-motion:reduce){#ss-bg{transition:none}}
/* Neubewertung: Vorschlag im Screensaver sichtbar ("Note 3 → Note 2" + vorgemerkt) */
#ss-note .ss-note-old{opacity:.5;text-decoration:line-through;text-decoration-thickness:.08em}
#ss-note .ss-note-arrow{opacity:.55;margin:0 .15em}
#ss-note .ss-note-new{font-size:1.5em;font-weight:800}
#ss-note .ss-note-pill{display:inline-block;margin-left:.5em;padding:.08em .5em;border-radius:999px;
  font-size:.62em;font-weight:700;letter-spacing:.04em;color:#a7e03a;background:#16321c;border:1px solid #2f6b35;vertical-align:middle}
</style>
</head>
<body>
<div id="ps-legend-overlay">
  <div id="ps-legend-box">
    <button id="ps-legend-close" title="Schließen">&#10005;</button>
    <h2>&#9432; Spielstatus-Legende</h2>
    <table id="ps-legend-table">
      <thead>
        <tr>
          <th>Farbe</th>
          <th>Code</th>
          <th>Note&nbsp;1</th>
          <th>Note&nbsp;2</th>
          <th>Note&nbsp;3</th>
          <th>Note&nbsp;4/5</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="ps-legend-body"></tbody>
    </table>
  </div>
</div>

<div id="app">

<header>
  <h1>&#9835; YAMS <span class="web">Web</span>Player</h1>
  <div id="stats-bar"></div>
  <div class="spacer"></div>
  <a href="/generator" class="btn secondary" style="text-decoration:none">&#127928; Generator</a>
  <button class="btn secondary" id="toggle-search-btn">&#128269; Suche</button>
  <button class="btn secondary" id="ps-legend-btn" title="Farb-Legende Spielstatus">&#9432; Spielstatus-Legende</button>
  <button class="btn secondary" onclick="location.href='/stats'" title="Statistische Auswertung">&#128202; Statistik</button>
</header>

<datalist id="artist-list"></datalist>
<div id="search-panel">
  <div class="row">
    <div class="sf wide">
      <label>Artist</label>
      <input type="text" id="f-artist" placeholder="Künstlername…" list="artist-list" autocomplete="off">
    </div>
    <div class="sf">
      <label>Genre</label>
      <button type="button" class="genre-open-btn" id="genre-btn-main">
        Genres&#160;<span class="genre-badge" id="genre-badge-main"></span>
      </button>
    </div>
    <div class="sf">
      <label>Aufnahme-Typ</label>
      <div class="check-group">
        <label class="cb-item"><input type="checkbox" name="f-typ" value="S" checked> Studio</label>
        <label class="cb-item"><input type="checkbox" name="f-typ" value="L"> Live</label>
        <label class="cb-item"><input type="checkbox" name="f-typ" value="M"> Mixed</label>
      </div>
    </div>
    <div class="sf">
      <label>Kategorie</label>
      <div class="check-group">
        <label class="cb-item"><input type="checkbox" name="f-cat" value="O" checked> Original</label>
        <label class="cb-item"><input type="checkbox" name="f-cat" value="S"> Single</label>
        <label class="cb-item"><input type="checkbox" name="f-cat" value="C"> Compilation</label>
        <label class="cb-item"><input type="checkbox" name="f-cat" value="M"> Mix</label>
        <label class="cb-item"><input type="checkbox" name="f-cat" value="B"> Bootleg</label>
      </div>
    </div>
    <div class="sf" style="min-width:80px">
      <label>Jahr von</label>
      <input type="number" id="f-year-from" placeholder="1980" min="1900" max="2099" style="width:80px">
    </div>
    <div class="sf" style="min-width:80px">
      <label>Jahr bis</label>
      <input type="number" id="f-year-to" placeholder="2025" min="1900" max="2099" style="width:80px">
    </div>
    <div class="sf" style="min-width:170px">
      <label>Max. Wertung: <span id="rating-val">5.0000</span> <small style="color:var(--muted)">(1=beste)</small></label>
      <input type="range" id="f-rating" min="1" max="5" step="0.1" value="5">
    </div>
    <div class="sf">
      <label>Songs</label>
      <div class="check-group">
        <label class="cb-item"><input type="checkbox" id="f-only-original" checked> Nur Originalsongs</label>
      </div>
    </div>
    <button class="btn" id="search-btn">Suchen</button>
    <button class="btn secondary" id="reset-btn">Reset</button>
  </div>
</div>

<!-- By-Year Options Panel -->
<div id="byyear-panel">
  <div class="sf">
    <label>Aufnahme-Typ</label>
    <div class="check-group">
      <label class="cb-item"><input type="checkbox" name="by-typ" value="S" checked> Studio</label>
      <label class="cb-item"><input type="checkbox" name="by-typ" value="L"> Live</label>
      <label class="cb-item"><input type="checkbox" name="by-typ" value="M"> Mixed</label>
    </div>
  </div>
  <div class="sf">
    <label>Kategorie</label>
